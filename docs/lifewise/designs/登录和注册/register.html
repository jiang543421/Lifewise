<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 — Lifewise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  color: #0F172A;
  background: linear-gradient(135deg, #F0FDF4 0%, #ECFCCB 50%, #FEFCE8 100%);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
a { color: #65A30D; text-decoration: none; }
a:hover { text-decoration: underline; }

.page { width: 100%; max-width: 1080px; display: grid; grid-template-columns: 1fr 1fr; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12); min-height: 720px; }

.brand-side {
  background: linear-gradient(135deg, #84CC16 0%, #65A30D 100%);
  color: white;
  padding: 48px 40px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}
.brand-side::before {
  content: '';
  position: absolute;
  top: -100px; right: -100px;
  width: 300px; height: 300px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  filter: blur(40px);
}
.brand-side::after {
  content: '';
  position: absolute;
  bottom: -80px; left: -80px;
  width: 250px; height: 250px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
  filter: blur(30px);
}
.brand-logo { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; position: relative; z-index: 1; }
.brand-logo .logo-mark {
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  backdrop-filter: blur(10px);
}
.brand-content { position: relative; z-index: 1; }
.brand-content h2 { font-size: 28px; font-weight: 700; margin: 0 0 12px; line-height: 1.3; }
.brand-content p { font-size: 14px; opacity: 0.9; margin: 0; line-height: 1.7; }
.brand-features { margin-top: 32px; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }
.brand-feature { display: flex; align-items: center; gap: 10px; font-size: 13px; opacity: 0.95; }
.brand-feature .ico {
  width: 24px; height: 24px;
  background: rgba(255,255,255,0.2);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}
.brand-footer { font-size: 12px; opacity: 0.7; position: relative; z-index: 1; }

.form-side {
  padding: 40px 48px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow-y: auto;
}
.form-header { margin-bottom: 24px; }
.form-header h1 { font-size: 24px; font-weight: 700; margin: 0 0 8px; color: #0F172A; display: flex; align-items: center; gap: 10px; }
.form-header h1 .step-tag { font-size: 11px; padding: 3px 8px; background: #ECFCCB; color: #65A30D; border-radius: 12px; font-weight: 600; }
.form-header p { font-size: 14px; color: #64748B; margin: 0; }

.field { margin-bottom: 16px; }
.field-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: #334155; }
.field-label .helper { font-size: 12px; color: #94A3B8; font-weight: 400; }
.field-label .helper.req { color: #EF4444; }

.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
  border: 1px solid #E2E8F0;
  border-radius: 10px;
  background: white;
  transition: all 0.15s;
}
.input-wrap:hover { border-color: #CBD5E1; }
.input-wrap:focus-within { border-color: #65A30D; box-shadow: 0 0 0 3px rgba(101, 163, 13, 0.12); }
.input-wrap .leading { padding: 0 12px; color: #94A3B8; display: flex; align-items: center; }
.input-wrap .leading svg { width: 18px; height: 18px; }
.input {
  flex: 1;
  border: none;
  outline: none;
  padding: 11px 12px 11px 0;
  font-size: 14px;
  font-family: inherit;
  background: transparent;
  color: #0F172A;
}
.input.has-trailing { padding-right: 80px; }
.input-wrap .trailing {
  position: absolute;
  right: 8px;
  color: #94A3B8;
  display: flex;
  align-items: center;
  gap: 4px;
}
.input-wrap .check-icon { display: none; color: #10B981; }
.input-wrap.has-value .check-icon { display: flex; }
.input-wrap .toggle-pwd { padding: 6px; border-radius: 4px; cursor: pointer; display: flex; }
.input-wrap .toggle-pwd:hover { color: #475569; background: #F1F5F9; }

.username-suggest { display: none; margin-top: 6px; font-size: 12px; color: #64748B; background: #F8FAFC; padding: 8px 10px; border-radius: 6px; border: 1px dashed #E2E8F0; }
.username-suggest.show { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.username-suggest .suggest-tag { background: white; border: 1px solid #E2E8F0; padding: 2px 8px; border-radius: 4px; font-family: monospace; font-size: 11px; cursor: pointer; }
.username-suggest .suggest-tag:hover { border-color: #65A30D; color: #65A30D; }

.field-error { display: none; margin-top: 6px; font-size: 12px; color: #EF4444; }
.field-error.show { display: flex; align-items: center; gap: 4px; }
.input-wrap.error { border-color: #EF4444; }
.input-wrap.error:focus-within { box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12); }
.input-wrap.success { border-color: #10B981; }

.pwd-strength { margin-top: 8px; display: flex; align-items: center; gap: 8px; }
.pwd-bar { flex: 1; height: 4px; background: #E2E8F0; border-radius: 2px; overflow: hidden; }
.pwd-bar > div { height: 100%; width: 0%; transition: all 0.25s; border-radius: 2px; }
.pwd-text { font-size: 11px; color: #94A3B8; min-width: 56px; text-align: right; font-weight: 500; }
.pwd-rules { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: #94A3B8; flex-wrap: wrap; }
.pwd-rules span { display: flex; align-items: center; gap: 3px; }
.pwd-rules span.met { color: #10B981; }
.pwd-rules span.met::before { content: '✓'; }

.terms { margin: 16px 0 20px; }
.checkbox { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 13px; color: #475569; user-select: none; line-height: 1.5; }
.checkbox input { display: none; }
.checkbox .check {
  width: 18px; height: 18px;
  border: 1.5px solid #CBD5E1;
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  background: white;
  flex-shrink: 0;
  margin-top: 1px;
}
.checkbox input:checked + .check { background: #65A30D; border-color: #65A30D; }
.checkbox input:checked + .check::after { content: ''; width: 5px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); margin-bottom: 2px; }

.btn-primary {
  width: 100%;
  padding: 13px;
  background: #65A30D;
  color: white;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary:hover { background: #4D7C0F; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(101, 163, 13, 0.3); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { background: #94A3B8; cursor: not-allowed; transform: none; box-shadow: none; }

.form-footer { margin-top: 20px; text-align: center; font-size: 13px; color: #64748B; }
.form-footer a { font-weight: 500; }

@media (max-width: 900px) {
  .page { grid-template-columns: 1fr; max-width: 480px; }
  .brand-side { display: none; }
  .form-side { padding: 32px 24px; }
}
@media (max-width: 480px) {
  body { padding: 0; background: white; }
  .page { box-shadow: none; border-radius: 0; min-height: 100vh; }
  .form-side { padding: 24px 20px; }
}
</style>
</head>
<body>

<div class="page">

  <aside class="brand-side">
    <div class="brand-logo">
      <div class="logo-mark">L</div>
      <span>Lifewise</span>
    </div>

    <div class="brand-content">
      <h2>开启你的<br/>明智生活</h2>
      <p>30 秒注册，立即记录每一笔收支、每一次抉择。让 AI 帮你看见趋势，让数据帮你做出更好的选择。</p>
      <div class="brand-features">
        <div class="brand-feature"><span class="ico">⚡</span>30 秒快速注册</div>
        <div class="brand-feature"><span class="ico">🎯</span>个性化引导</div>
        <div class="brand-feature"><span class="ico">📱</span>多端同步</div>
        <div class="brand-feature"><span class="ico">🛡️</span>隐私优先</div>
      </div>
    </div>

    <div class="brand-footer">© 2026 Lifewise · 让生活更清晰</div>
  </aside>

  <main class="form-side">
    <div class="form-header">
      <h1>创建新账号 <span class="step-tag">第 1 步 / 共 1 步</span></h1>
      <p>使用用户名、邮箱注册 Lifewise</p>
    </div>

    <form id="registerForm" novalidate>

      <div class="field">
        <label class="field-label" for="username">
          <span>用户名 <span class="helper req">*</span></span>
          <span class="helper">3-20 字符 · 字母开头</span>
        </label>
        <div class="input-wrap" id="usernameWrap">
          <span class="leading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input class="input" type="text" id="username" name="username" placeholder="例如：lifewise_99" autocomplete="username" maxlength="20" />
          <span class="trailing">
            <span class="check-icon" id="usernameCheck">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
          </span>
        </div>
        <div class="field-error" id="usernameError">用户名格式不正确</div>
        <div class="username-suggest" id="usernameSuggest">
          <span>💡 推荐：</span>
          <span class="suggest-tag" data-u="lifewise_2026">lifewise_2026</span>
          <span class="suggest-tag" data-u="alex_lee_smart">alex_lee_smart</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="email">
          <span>邮箱 <span class="helper req">*</span></span>
          <span class="helper">用于找回密码</span>
        </label>
        <div class="input-wrap" id="emailWrap">
          <span class="leading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
          <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
          <span class="trailing">
            <span class="check-icon" id="emailCheck">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
          </span>
        </div>
        <div class="field-error" id="emailError">邮箱格式不正确</div>
      </div>

      <div class="field">
        <label class="field-label" for="password">
          <span>密码 <span class="helper req">*</span></span>
          <span class="helper">8 位以上 · 含大小写数字</span>
        </label>
        <div class="input-wrap" id="passwordWrap">
          <span class="leading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input class="input has-trailing" type="password" id="password" name="password" placeholder="请输入密码" autocomplete="new-password" />
          <span class="trailing">
            <span class="check-icon" id="passwordCheck">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
            <span class="toggle-pwd" id="togglePassword">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
          </span>
        </div>
        <div class="pwd-strength">
          <div class="pwd-bar"><div id="pwdBar"></div></div>
          <span class="pwd-text" id="pwdText">强度：—</span>
        </div>
        <div class="pwd-rules">
          <span id="rule-len">8+ 位</span>
          <span id="rule-upper">大写</span>
          <span id="rule-lower">小写</span>
          <span id="rule-digit">数字</span>
        </div>
        <div class="field-error" id="passwordError">密码不符合强度要求</div>
      </div>

      <div class="field">
        <label class="field-label" for="confirmPassword">
          <span>确认密码 <span class="helper req">*</span></span>
        </label>
        <div class="input-wrap" id="confirmWrap">
          <span class="leading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input class="input" type="password" id="confirmPassword" name="confirmPassword" placeholder="再次输入密码" autocomplete="new-password" />
          <span class="trailing">
            <span class="check-icon" id="confirmCheck">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
          </span>
        </div>
        <div class="field-error" id="confirmError">两次密码不一致</div>
      </div>

      <div class="terms">
        <label class="checkbox">
          <input type="checkbox" id="agreedToTerms" />
          <span class="check"></span>
          <span>我已阅读并同意 <a href="#" onclick="event.preventDefault();showTerms()">《服务条款》</a> 和 <a href="#" onclick="event.preventDefault();showPrivacy()">《隐私政策》</a></span>
        </label>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn" disabled>
        <span>创建账号</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>

    </form>

    <div class="form-footer">
      已有账号？<a href="login.html">直接登录</a>
    </div>
  </main>

</div>

<script>
function showTerms() { alert('📋 服务条款\n\n演示版：实际条款见 git 历史 auth-design.md §1 决策 15'); }
function showPrivacy() { alert('🔒 隐私政策\n\n演示版：实际隐私政策见业务架构 §6.1'); }

const usernameInput = document.getElementById('username');
const emailInput = document.getElementById('email');
const pwdInput = document.getElementById('password');
const confirmInput = document.getElementById('confirmPassword');
const termsInput = document.getElementById('agreedToTerms');
const submitBtn = document.getElementById('submitBtn');

const usernameWrap = document.getElementById('usernameWrap');
const emailWrap = document.getElementById('emailWrap');
const pwdWrap = document.getElementById('passwordWrap');
const confirmWrap = document.getElementById('confirmWrap');

const usernameSuggest = document.getElementById('usernameSuggest');

document.querySelectorAll('.suggest-tag').forEach(tag => {
  tag.addEventListener('click', () => {
    usernameInput.value = tag.dataset.u;
    usernameInput.dispatchEvent(new Event('input'));
    usernameSuggest.classList.remove('show');
    usernameInput.focus();
  });
});

document.getElementById('togglePassword').addEventListener('click', () => {
  pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
});

function validateUsername() {
  const v = usernameInput.value.trim();
  if (!v) {
    usernameWrap.classList.remove('success', 'has-value');
    document.getElementById('usernameError').classList.remove('show');
    usernameSuggest.classList.remove('show');
    return false;
  }
  const ok = /^[a-z][a-z0-9_]{2,19}$/.test(v);
  if (!ok) {
    usernameWrap.classList.add('error');
    usernameWrap.classList.remove('success');
    document.getElementById('usernameError').textContent = '需 3-20 字符，小写字母/数字/下划线，字母开头';
    document.getElementById('usernameError').classList.add('show');
    usernameSuggest.classList.remove('show');
    return false;
  }
  usernameWrap.classList.remove('error');
  usernameWrap.classList.add('success', 'has-value');
  document.getElementById('usernameError').classList.remove('show');
  const reserved = ['admin','root','system','api','auth','login','register','null','undefined','nan'];
  if (reserved.includes(v)) {
    usernameWrap.classList.remove('success');
    usernameWrap.classList.add('error');
    document.getElementById('usernameError').textContent = '该用户名为保留字，请重新选择';
    document.getElementById('usernameError').classList.add('show');
    usernameSuggest.classList.add('show');
    return false;
  }
  return true;
}

function validateEmail() {
  const v = emailInput.value.trim();
  if (!v) {
    emailWrap.classList.remove('success', 'has-value');
    document.getElementById('emailError').classList.remove('show');
    return false;
  }
  const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  if (!ok) {
    emailWrap.classList.add('error');
    emailWrap.classList.remove('success');
    document.getElementById('emailError').textContent = '邮箱格式不正确';
    document.getElementById('emailError').classList.add('show');
    return false;
  }
  emailWrap.classList.remove('error');
  emailWrap.classList.add('success', 'has-value');
  document.getElementById('emailError').classList.remove('show');
  return true;
}

function validatePassword() {
  const v = pwdInput.value;
  if (!v) {
    pwdWrap.classList.remove('success', 'has-value');
    document.getElementById('passwordError').classList.remove('show');
    updateStrength('', 0);
    return false;
  }
  const hasLen = v.length >= 8;
  const hasUpper = /[A-Z]/.test(v);
  const hasLower = /[a-z]/.test(v);
  const hasDigit = /\d/.test(v);
  document.getElementById('rule-len').classList.toggle('met', hasLen);
  document.getElementById('rule-upper').classList.toggle('met', hasUpper);
  document.getElementById('rule-lower').classList.toggle('met', hasLower);
  document.getElementById('rule-digit').classList.toggle('met', hasDigit);

  const pass = hasLen && hasUpper && hasLower && hasDigit;
  if (!pass) {
    pwdWrap.classList.add('error');
    pwdWrap.classList.remove('success');
    document.getElementById('passwordError').textContent = '密码需 8+ 位、大写+小写+数字';
    document.getElementById('passwordError').classList.add('show');
  } else {
    pwdWrap.classList.remove('error');
    pwdWrap.classList.add('success', 'has-value');
    document.getElementById('passwordError').classList.remove('show');
  }
  const score = [hasLen, hasUpper, hasLower, hasDigit].filter(Boolean).length + (v.length >= 12 ? 1 : 0);
  const levels = [
    { color: '#EF4444', width: '20%', text: '弱' },
    { color: '#F97316', width: '40%', text: '一般' },
    { color: '#F59E0B', width: '60%', text: '中等' },
    { color: '#10B981', width: '80%', text: '强' },
    { color: '#10B981', width: '100%', text: '很强' }
  ];
  const level = levels[Math.min(score, 4)];
  updateStrength(level.color, level.width, level.text);
  return pass;
}

function updateStrength(color, width, text) {
  const bar = document.getElementById('pwdBar');
  const txt = document.getElementById('pwdText');
  bar.style.background = color || '#E2E8F0';
  bar.style.width = width || '0%';
  txt.textContent = text ? '强度：' + text : '强度：—';
  txt.style.color = color || '#94A3B8';
}

function validateConfirm() {
  const v = confirmInput.value;
  if (!v) {
    confirmWrap.classList.remove('success', 'has-value');
    document.getElementById('confirmError').classList.remove('show');
    return false;
  }
  if (v !== pwdInput.value) {
    confirmWrap.classList.add('error');
    confirmWrap.classList.remove('success');
    document.getElementById('confirmError').textContent = '两次密码不一致';
    document.getElementById('confirmError').classList.add('show');
    return false;
  }
  confirmWrap.classList.remove('error');
  confirmWrap.classList.add('success', 'has-value');
  document.getElementById('confirmError').classList.remove('show');
  return true;
}

function checkSubmit() {
  const ok = validateUsername() & validateEmail() & validatePassword() & validateConfirm() & termsInput.checked;
  submitBtn.disabled = !ok;
}

usernameInput.addEventListener('input', () => { validateUsername(); checkSubmit(); });
emailInput.addEventListener('input', () => { validateEmail(); checkSubmit(); });
pwdInput.addEventListener('input', () => { validatePassword(); validateConfirm(); checkSubmit(); });
confirmInput.addEventListener('input', () => { validateConfirm(); checkSubmit(); });
termsInput.addEventListener('change', checkSubmit);

document.getElementById('registerForm').addEventListener('submit', (e) => {
  e.preventDefault();
  if (submitBtn.disabled) return;
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span>创建中...</span>';
  setTimeout(() => {
    alert('✅ 演示版：注册请求成功\n\n将跳转首次登录引导（§8）');
