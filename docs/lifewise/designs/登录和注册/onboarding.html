<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开始使用 Lifewise — 首次引导</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  color: #0F172A;
  background: linear-gradient(135deg, #F0FDF4 0%, #ECFCCB 50%, #FEFCE8 100%);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
a { color: #65A30D; text-decoration: none; }

.page { width: 100%; max-width: 720px; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12); min-height: 560px; display: flex; flex-direction: column; }

.header {
  padding: 28px 40px 20px;
  border-bottom: 1px solid #F1F5F9;
  position: relative;
}
.header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.brand-logo { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; color: #0F172A; }
.brand-logo .logo-mark {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #84CC16 0%, #65A30D 100%);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  color: white;
}
.skip-btn { font-size: 13px; color: #94A3B8; padding: 6px 12px; border-radius: 6px; transition: all 0.15s; }
.skip-btn:hover { background: #F1F5F9; color: #475569; }

.progress { display: flex; align-items: center; gap: 8px; }
.progress-step { display: flex; align-items: center; gap: 8px; flex: 1; }
.progress-bar { flex: 1; height: 4px; background: #E2E8F0; border-radius: 2px; position: relative; overflow: hidden; }
.progress-bar > div { position: absolute; left: 0; top: 0; height: 100%; background: #65A30D; border-radius: 2px; transition: width 0.4s ease; width: 0%; }
.progress-dot { width: 24px; height: 24px; border-radius: 50%; background: #E2E8F0; color: #94A3B8; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; transition: all 0.3s; }
.progress-step.done .progress-dot { background: #65A30D; color: white; }
.progress-step.done .progress-bar > div { width: 100%; }
.progress-step.active .progress-dot { background: white; border: 2px solid #65A30D; color: #65A30D; box-shadow: 0 0 0 4px rgba(101, 163, 13, 0.1); }

.content { flex: 1; padding: 40px 60px; overflow-y: auto; }
.step { display: none; }
.step.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.step-icon { width: 56px; height: 56px; border-radius: 14px; background: #ECFCCB; color: #65A30D; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 16px; }
.step h2 { font-size: 22px; font-weight: 700; margin: 0 0 8px; color: #0F172A; }
.step .subtitle { font-size: 14px; color: #64748B; margin: 0 0 28px; }

.field { margin-bottom: 18px; }
.field-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: #334155; }
.field-label .helper { font-size: 12px; color: #94A3B8; font-weight: 400; }
.input-wrap { position: relative; display: flex; align-items: center; border: 1px solid #E2E8F0; border-radius: 10px; background: white; transition: all 0.15s; }
.input-wrap:hover { border-color: #CBD5E1; }
.input-wrap:focus-within { border-color: #65A30D; box-shadow: 0 0 0 3px rgba(101, 163, 13, 0.12); }
.input-wrap .leading { padding: 0 12px; color: #94A3B8; display: flex; align-items: center; }
.input-wrap .leading svg { width: 18px; height: 18px; }
.input { flex: 1; border: none; outline: none; padding: 12px 14px 12px 0; font-size: 14px; font-family: inherit; background: transparent; color: #0F172A; }
.input::placeholder { color: #94A3B8; }
.input-wrap.error { border-color: #EF4444; }
.input-wrap.error:focus-within { box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12); }
.input-wrap.success { border-color: #10B981; }
.field-error { display: none; margin-top: 6px; font-size: 12px; color: #EF4444; }
.field-error.show { display: flex; align-items: center; gap: 4px; }
.char-count { font-size: 12px; color: #94A3B8; }

.tz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 320px; overflow-y: auto; padding: 4px; }
.tz-item { padding: 10px 14px; border: 1px solid #E2E8F0; border-radius: 8px; cursor: pointer; transition: all 0.15s; display: flex; justify-content: space-between; align-items: center; }
.tz-item:hover { border-color: #CBD5E1; background: #F8FAFC; }
.tz-item.selected { border-color: #65A30D; background: #ECFCCB; color: #365314; }
.tz-item .name { font-size: 13px; font-weight: 500; }
.tz-item .offset { font-size: 11px; color: #94A3B8; font-family: monospace; }
.tz-item.selected .offset { color: #65A30D; }
.tz-search { width: 100%; padding: 10px 14px; border: 1px solid #E2E8F0; border-radius: 8px; font-size: 13px; margin-bottom: 10px; outline: none; transition: all 0.15s; }
.tz-search:focus { border-color: #65A30D; box-shadow: 0 0 0 3px rgba(101, 163, 13, 0.12); }

.footer { padding: 20px 40px; border-top: 1px solid #F1F5F9; display: flex; justify-content: space-between; align-items: center; background: #F8FAFC; }
.btn { padding: 11px 24px; border-radius: 10px; font-size: 14px; font-weight: 600; transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
.btn-secondary { background: white; color: #475569; border: 1px solid #E2E8F0; }
.btn-secondary:hover { background: #F1F5F9; border-color: #CBD5E1; }
.btn-primary { background: #65A30D; color: white; }
.btn-primary:hover { background: #4D7C0F; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(101, 163, 13, 0.3); }
.btn-primary:disabled { background: #94A3B8; cursor: not-allowed; transform: none; box-shadow: none; }

@media (max-width: 480px) {
  body { padding: 0; background: white; }
  .page { border-radius: 0; min-height: 100vh; box-shadow: none; }
  .header { padding: 20px 24px 16px; }
  .content { padding: 28px 24px; }
  .footer { padding: 16px 24px; }
  .tz-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="page">

  <div class="header">
    <div class="header-row">
      <div class="brand-logo">
        <div class="logo-mark">L</div>
        <span>Lifewise</span>
      </div>
      <button class="skip-btn" id="skipBtn">跳过引导</button>
    </div>
    <div class="progress">
      <div class="progress-step active" id="ps-1">
        <div class="progress-dot">1</div>
        <div class="progress-bar"><div></div></div>
      </div>
      <div class="progress-step" id="ps-2">
        <div class="progress-dot">2</div>
        <div class="progress-bar"><div></div></div>
      </div>
    </div>
  </div>

  <div class="content">

    <div class="step active" id="step-1">
      <div class="step-icon">👋</div>
      <h2>让我们认识一下</h2>
      <p class="subtitle">取一个昵称，账号将显示这个名字</p>

      <div class="field">
        <label class="field-label" for="nickname">
          <span>昵称</span>
          <span class="char-count"><span id="curLen">0</span> / 30</span>
        </label>
        <div class="input-wrap" id="nicknameWrap">
          <span class="leading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input class="input" type="text" id="nickname" name="nickname" placeholder="例如：明智生活家" maxlength="30" autocomplete="nickname" />
        </div>
        <div class="field-error" id="nicknameError">昵称需 1-30 字符，且不含控制字符</div>
      </div>
    </div>

    <div class="step" id="step-2">
      <div class="step-icon">🌏</div>
      <h2>选择你的时区</h2>
      <p class="subtitle">时间显示和提醒按此时区计算</p>

      <input type="text" class="tz-search" id="tzSearch" placeholder="🔍 搜索时区（如：Shanghai、Tokyo）" />

      <div class="tz-grid" id="tzGrid"></div>
    </div>

  </div>

  <div class="footer">
    <button class="btn btn-secondary" id="prevBtn" style="visibility:hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span>上一步</span>
    </button>
    <button class="btn btn-primary" id="nextBtn" disabled>
      <span id="nextBtnText">下一步</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>

</div>

<script>
const timezones = [
  { id: 'Asia/Shanghai', name: '上海', offset: '+08:00' },
  { id: 'Asia/Hong_Kong', name: '香港', offset: '+08:00' },
  { id: 'Asia/Taipei', name: '台北', offset: '+08:00' },
  { id: 'Asia/Singapore', name: '新加坡', offset: '+08:00' },
  { id: 'Asia/Tokyo', name: '东京', offset: '+09:00' },
  { id: 'Asia/Seoul', name: '首尔', offset: '+09:00' },
  { id: 'Asia/Bangkok', name: '曼谷', offset: '+07:00' },
  { id: 'Asia/Manila', name: '马尼拉', offset: '+08:00' },
  { id: 'Asia/Kolkata', name: '加尔各答', offset: '+05:30' },
  { id: 'Asia/Dubai', name: '迪拜', offset: '+04:00' },
  { id: 'Australia/Sydney', name: '悉尼', offset: '+10:00' },
  { id: 'Pacific/Auckland', name: '奥克兰', offset: '+12:00' },
  { id: 'Europe/London', name: '伦敦', offset: '+00:00' },
  { id: 'Europe/Paris', name: '巴黎', offset: '+01:00' },
  { id: 'Europe/Berlin', name: '柏林', offset: '+01:00' },
  { id: 'Europe/Moscow', name: '莫斯科', offset: '+03:00' },
  { id: 'America/New_York', name: '纽约', offset: '-05:00' },
  { id: 'America/Chicago', name: '芝加哥', offset: '-06:00' },
  { id: 'America/Los_Angeles', name: '洛杉矶', offset: '-08:00' },
  { id: 'America/Sao_Paulo', name: '圣保罗', offset: '-03:00' }
];

const tzGrid = document.getElementById('tzGrid');
let selectedTz = 'Asia/Shanghai';

function renderTz(filter = '') {
  tzGrid.innerHTML = '';
  const list = timezones.filter(t => !filter || t.name.toLowerCase().includes(filter.toLowerCase()) || t.id.toLowerCase().includes(filter.toLowerCase()));
  list.forEach(t => {
    const div = document.createElement('div');
    div.className = 'tz-item' + (t.id === selectedTz ? ' selected' : '');
    div.innerHTML = '<span class="name">' + t.name + '</span><span class="offset">' + t.offset + '</span>';
    div.onclick = () => {
      selectedTz = t.id;
      renderTz(filter);
      checkNext();
    };
    tzGrid.appendChild(div);
  });
}
renderTz();

document.getElementById('tzSearch').addEventListener('input', (e) => renderTz(e.target.value));

let currentStep = 1;
const nextBtn = document.getElementById('nextBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtnText = document.getElementById('nextBtnText');

function showStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step-' + n).classList.add('active');
  for (let i = 1; i <= 2; i++) {
    const el = document.getElementById('ps-' + i);
    el.classList.remove('active', 'done');
    if (i < n) el.classList.add('done');
    else if (i === n) el.classList.add('active');
  }
  prevBtn.style.visibility = n === 1 ? 'hidden' : 'visible';
  nextBtnText.textContent = n === 2 ? '完成' : '下一步';
  checkNext();
  if (n === 2) {
    const match = document.querySelector('.tz-item.selected');
    if (match) match.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}

const nicknameInput = document.getElementById('nickname');
const nicknameWrap = document.getElementById('nicknameWrap');
const nicknameError = document.getElementById('nicknameError');
const charCount = document.getElementById('curLen');

nicknameInput.addEventListener('input', () => {
  charCount.textContent = nicknameInput.value.length;
  const v = nicknameInput.value;
  if (/[\x00-\x1F\x7F]/.test(v)) {
    nicknameWrap.classList.add('error');
    nicknameError.classList.add('show');
    nicknameInput.value = v.replace(/[\x00-\x1F\x7F]/g, '');
    return;
  }
  nicknameWrap.classList.remove('error');
  nicknameError.classList.remove('show');
  if (v.length > 0) nicknameWrap.classList.add('success');
  else nicknameWrap.classList.remove('success');
  checkNext();
});

function validateNickname() {
  const v = nicknameInput.value.trim();
  if (!v) {
    nicknameWrap.classList.add('error');
    nicknameError.textContent = '请输入昵称';
    nicknameError.classList.add('show');
    return false;
  }
  if (v.length > 30) {
    nicknameWrap.classList.add('error');
    nicknameError.classList.add('show');
    return false;
  }
  nicknameWrap.classList.remove('error');
  return true;
}

function checkNext() {
  if (currentStep === 1) {
    nextBtn.disabled = nicknameInput.value.trim().length === 0;
  } else {
    nextBtn.disabled = false;
  }
}

nextBtn.addEventListener('click', () => {
  if (currentStep === 1) {
    if (!validateNickname()) return;
    currentStep = 2;
    showStep(2);
  } else {
    nextBtn.disabled = true;
    nextBtnText.textContent = '保存中...';
    setTimeout(() => {
      alert('✅ 演示版：引导完成！\n\n设置：\n· 昵称：' + nicknameInput.value + '\n· 时区：' + selectedTz + '\n\n下一站：AI/通知同意 Modal（不阻塞）');
      nextBtn.disabled = false;
      nextBtnText.textContent = '完成';
    }, 600);
  }
});

prevBtn.addEventListener('click', () => {
  if (currentStep > 1) {
    currentStep = 1;
    showStep(1);
  }
});

document.getElementById('skipBtn').addEventListener('click', () => {
  if (confirm('跳过引导会使用默认设置（昵称=username、时区=Asia/Shanghai），确定吗？')) {
    alert('✅ 演示版：跳过引导，使用默认设置');
  }
});

checkNext();
</script>

</body>
</html>
