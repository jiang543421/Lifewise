# ============================================================
# default.conf — Lifewise 步骤1B nginx 站点配置
#
# 覆盖 plan-deploy-nginx.md §3 / technical-architecture §2.2 全部要点：
#   - TLS 1.2/1.3 only（dev 自签证书占位）
#   - HSTS / CSP / X-Frame-Options / Referrer-Policy
#   - /api/auth/login IP 级 5/15min（rate=1r/m + burst=5 nodelay）
#   - /api/ai/chat IP 级 10r/m（burst=2）+ SSE keepalive
#   - 通用 /api/ai/ 与 /api/ 反代
#   - gzip（不含 SSE）
#   - 静态资源 immutable 缓存
#
# 注意：
#   - 证书路径占位（dev 用自签）；生产替换为 Let's Encrypt 路径
#   - app upstream 在 1A 阶段已就位（docker-compose.yml 命名为 app）
#   - /api/v1/ai/chat 命名见 technical-architecture §3.3；1A 阶段 nginx 暂未加入
#     docker-compose（与用户决策对齐），本配置为 1B 准备
# ============================================================

# --- upstream：app 容器 ---
upstream lifewise_app {
    server app:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# --- 限流 zone（共享内存）---
# login  ：IP 级 5/15min（burst=5 nodelay：前 5 个瞬时通过，第 6 即拒）
# api    ：IP 级 60r/m 兜底
# ai_chat：IP 级 10r/m（与 app scope=ai 双重防护）
limit_req_zone $binary_remote_addr zone=login:10m   rate=1r/m;
limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/m;
limit_req_zone $binary_remote_addr zone=ai_chat:10m rate=10r/m;

# ============================================================
# B-1 closure (v1.3.3): path-based X-User-Id header rejection
# CLAUDE.md §7.3.1 + ledger v1.3.2 B-1 hardening.
# 拒绝 client 注入 X-User-Id != 1 的请求；允许 X-User-Id=1 或无 header（fail-safe）。
# v1.0 单用户白名单下：
#   - client 不传 X-User-Id → nginx 设 X-User-Id=1（覆盖在 location 内）
#   - client 传 X-User-Id=1 → 通过（v1.0 兼容）
#   - client 传 X-User-Id=其他值 → 403 拒绝（v1.1+ 多用户 header 注入防御）
# v1.1+ 切多用户时：map 改为 reject all（含 X-User-Id=1），由 app JWT 链路鉴权。
# ============================================================
map $http_x_user_id $user_id_valid {
    default 0;
    "1"     1;
    ""      1;
}

# ============================================================
# HTTPS server（443）—— 主入口
# ============================================================
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name _;

    # --- TLS（dev 自签证书占位；生产用 Let's Encrypt）---
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- HSTS（31536000s = 1 年 + includeSubDomains） ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- CSP（X6：补 font-src 给 Inter / Noto Sans SC Google Fonts）---
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://localhost; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # --- gzip（非 SSE） ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ============================================================
    # 静态资源（immutable 缓存）
    # ============================================================
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/" always;
    }

    # ============================================================
    # /api/auth/login — IP 级 5/15min（X6：精确匹配 + 带 URI proxy_pass）
    # ============================================================
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://lifewise_app/api/auth/login;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ============================================================
    # /api/ai/chat — SSE 流式聊天（v1.0.3 已移除 location）
    #   v1.0 release cut 时 nginx 配置了 location 但 Spring 侧无 controller；
    #   生产 curl /api/ai/chat 会经 nginx 反代到 app 然后 404。详见
    #   known-limitations-v1.md §2 B-11（deferred v1.1+ per plan-06-ai §2.6）。
    #   ai_chat 限流 zone 同步保留，v1.1+ 重新实现 chat 端点时复用。
    # ============================================================

    # ============================================================
    # 通用 /api/ai/ — 非 chat 路径（reports / jobs / consent）
    # ============================================================
    location /api/ai/ {
        # B-1 closure: reject client-injected X-User-Id != 1
        if ($user_id_valid = 0) { return 403 "X-User-Id header injection not allowed in v1.0"; }
        limit_req zone=api burst=120 nodelay;
        proxy_pass http://lifewise_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # v1.0 个人版强制覆盖 X-User-Id（CLAUDE.md §7.3.1）
        proxy_set_header X-User-Id      "1";
        proxy_set_header X-Real-User-Id "1";
    }

    # ============================================================
    # 通用 /api/ — app 侧走 Redis 令牌桶（per user / per ip 各自 scope）
    # ============================================================
    location /api/ {
        # B-1 closure: reject client-injected X-User-Id != 1
        if ($user_id_valid = 0) { return 403 "X-User-Id header injection not allowed in v1.0"; }
        limit_req zone=api burst=120 nodelay;
        proxy_pass http://lifewise_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # v1.0 个人版强制覆盖 X-User-Id（CLAUDE.md §7.3.1）
        proxy_set_header X-User-Id      "1";
        proxy_set_header X-Real-User-Id "1";
        proxy_read_timeout    60s;
    }

    # ============================================================
    # 健康检查端点（仅 nginx 内网可达，对外仅 /api/*）
    # ============================================================
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ============================================================
    # 根路径（PWA App Shell）
    # ============================================================
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

# ============================================================
# HTTP server（80）—— 强制跳转 HTTPS（HSTS 已生效前必须保留）
# ============================================================
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # 健康检查端点（同 443，便于无 TLS 探针）
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 其他请求统一跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}