# ============================================================
# nginx.conf — Lifewise 步骤1B nginx 主配置
#
# 范围：
#   - 加载 conf.d/*.conf（站点）
#   - 全局性能参数（worker / sendfile / gzip 由 site 控制）
#   - 与 technical-architecture §1.3 网络分工：nginx ↔ lifewise-edge
#
# 严格遵循：
#   - plan-deploy-nginx.md §3 全局指令
#   - technical-architecture.md §2.2
#   - CLAUDE.md §7（Nginx TLS / HSTS / CSP / 限流）
#
# 注意：
#   - worker 数自动 = CPU 核数
#   - 不在此处启用 TLS（证书由 conf.d/default.conf 控制，便于 dev/prod 切换）
#   - 不绑定 80/443（由 conf.d/default.conf 单独监听）
# ============================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ---- MIME / 路径 ----
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # ---- 日志格式（JSON 风格便于聚合） ----
    log_format main escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"ua":"$http_user_agent"'
        '}';
    access_log /var/log/nginx/access.log main;

    # ---- 性能基础（仅限非 SSE / 非流式响应；SSE 由 location 单独关 buffering） ----
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 10m;     # 与 technical-architecture §3.4 RequestSizeLimit 对齐

    # ---- 通用安全响应头（conf.d/default.conf 可按 location 覆盖） ----
    add_header X-Frame-Options          "DENY"                           always;
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # ---- 站点 ----
    include /etc/nginx/conf.d/*.conf;
}